name: jarvis_agro_operator
description: JARVIS AGRO — Nawal Parasi family business operator app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Nepali (Bikram Sambat) calendar — BS<->AD conversion, month names.
  nepali_utils: ^3.0.6

  # WebSocket + HTTP
  web_socket_channel: ^2.4.0
  http: ^1.2.0

  # Local offline storage
  # sqflite works on Android/iOS/Windows; web needs sqflite_common_ffi_web
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0          # needed for Windows desktop
  sqflite_common_ffi_web: ^0.4.5+1   # needed for PWA / web
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # State management
  provider: ^6.1.2

  # File sharing & open
  share_plus: ^7.2.2
  open_filex: ^4.3.4

  # i18n
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  # Voice (device mic → server STT)
  # record ^6 supports Android, iOS, Windows, Web (MediaRecorder API)
  record: ^6.0.0
  # permission_handler covers Android/iOS/Windows.
  # On Web we skip it — browsers prompt natively via getUserMedia.
  permission_handler: ^11.3.0

  # Voice playback (server-synthesised TTS job confirmations)
  # Plays the bytes the server already sends in 'tts_audio' messages --
  # no on-device TTS engine, no extra native setup beyond this package.
  audioplayers: ^6.0.0

  # Cryptography — SHA-256 PIN hashing
  crypto: ^3.0.3

  # Path utilities
  path: ^1.9.0

  # UI icons
  cupertino_icons: ^1.0.8

flutter:
  uses-material-design: true
