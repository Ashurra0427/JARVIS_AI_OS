name: jarvis_agro_client
description: JARVIS AGRO — customer portal (job history, outstanding balance, request a job, TTS confirmations)
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Nepali (Bikram Sambat) calendar — BS<->AD conversion, month names.
  nepali_utils: ^3.0.6

  web_socket_channel: ^2.4.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  provider: ^6.1.2

  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  # TTS audio playback — plays tts_audio messages from JARVIS server
  audioplayers: ^6.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
