# ═══════════════════════════════════════════════════════════════════════════
# P0.6 SECURITY WARNING — READ BEFORE DEPLOYING
# ═══════════════════════════════════════════════════════════════════════════
#
# This config proxies JARVIS to the network. Before enabling it you MUST:
#
#  1. Set JARVIS_SECRET in your .env file (random token, e.g. openssl rand -hex 32).
#     Without it, server.py will now REFUSE to bind on non-localhost interfaces
#     (changed in Phase 0). This is NOT optional.
#
#  2. Add TLS termination in front of this VirtualHost before exposing to the
#     internet. This file currently terminates plain HTTP — all WebSocket traffic
#     including any credentials will be unencrypted over the wire without TLS.
#     Add an SSL VirtualHost on :443 or use Let's Encrypt (certbot --apache).
#
#  3. If you only need LAN access, bind server.py to your LAN IP specifically
#     (HOST=192.168.x.x in .env) rather than 0.0.0.0, and firewall port 7788.
#
# Deploying without completing steps 1-2 exposes an unauthenticated WebSocket
# server to the internet. DO NOT do this.
# ═══════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────
# Apache reverse proxy config for JARVIS AI OS (server.py on 127.0.0.1:7788)
#
# This does NOT change anything about how server.py binds (it still listens
# on 0.0.0.0:7788 and localhost access keeps working exactly as before).
# Apache simply sits in front and forwards traffic, so you can:
#   - expose JARVIS on port 80 (no :7788 needed)
#   - terminate HTTPS at Apache later if you want
#   - reach it from other devices on your LAN, or from the internet via
#     port-forwarding / a tunnel, without touching server.py
#
# Install:
#   sudo cp apache-jarvis.conf /etc/apache2/sites-available/jarvis.conf
#   sudo a2enmod proxy proxy_http proxy_wstunnel
#   sudo a2ensite jarvis.conf
#   sudo systemctl reload apache2
# ─────────────────────────────────────────────────────────────────────────

<VirtualHost *:80>
    ServerName jarvis.local
    # No domain needed: this VirtualHost answers for ANY hostname/IP that
    # hits port 80 on this machine (your LAN IP, "localhost", etc.)

    # Increase timeouts so long AI generations / TTS don't get cut off
    ProxyTimeout 300
    Timeout 300

    # ── WebSocket upgrade for /ws ──
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:7788/$1 [P,L]

    # ── Everything else (HTTP: HUD page, /metrics, /health, etc.) ──
    ProxyPass        / http://127.0.0.1:7788/
    ProxyPassReverse / http://127.0.0.1:7788/

    ErrorLog  ${APACHE_LOG_DIR}/jarvis_error.log
    CustomLog ${APACHE_LOG_DIR}/jarvis_access.log combined
</VirtualHost>